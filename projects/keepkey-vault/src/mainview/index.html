<!DOCTYPE html>
<!-- The app is dark-only.
     class="dark": Chakra's _dark condition (".dark &"), so its semantic tokens
     (gray palette, bg.panel, fg, borders) use their dark values.
     color-scheme: dark: native controls (select dropdowns on WebView2,
     scrollbars, date inputs) render dark. -->
<html lang="en" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeepKey Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
