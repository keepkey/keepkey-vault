name = "keepkey-clearsign"
main = "src/index.ts"
account_id = "53185d258559a5dae7d6fa6225cc46ba"
compatibility_date = "2026-08-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
CLEARSIGN_ENVIRONMENT = "production"
# Server-managed failover. Vault only talks to this ClearSign service.
# Pioneer first: it reads through our keyed node (public RPCs throttle
# Cloudflare egress). Pioneer v1.4.0 serves only getMultipleAccounts here.
CLEARSIGN_SOLANA_RPC_ENDPOINTS = "https://api.keepkey.info/api/v1/solana/rpc,https://api.mainnet-beta.solana.com,https://solana-rpc.publicnode.com"

[version_metadata]
binding = "CF_VERSION_METADATA"

[observability]
enabled = true
