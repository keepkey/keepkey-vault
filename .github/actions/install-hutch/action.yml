name: Install Hutch (pinned)
description: >
  Install Hutch 0.29.0 (the version projects/keepkey-vault/hutch.config.ts names).
  The archive is downloaded and checked against the sha256 pinned here before
  anything in it runs, then installed with the steps of the reviewed install.sh
  (sha256 ac0ad498dfb09d2bc80fc9a6a0254c183cd0f125c83dce32defff65a1cf793e7).
  Bump every value together when moving Hutch.

runs:
  using: composite
  steps:
    - name: Install Hutch 0.29.0
      shell: bash
      env:
        HUTCH_VERSION: '0.29.0'
        HUTCH_REVISION: a2c9255ed54f93225814d7d7cf04ad5a613e44eb
      run: |
        set -euo pipefail
        case "$(uname -s)-$(uname -m)" in
          Darwin-arm64) platform=macos-arm64; archive_sha=f081abca6d08d9d862577e77365f3cb5437e65858ca45a27173505e4e2345994 ;;
          Darwin-x86_64) platform=macos-x64; archive_sha=a8d0b5c9a330f02b9fe11222dadd1a4590f7d6f77e3f8f301fc9b5c360528b65 ;;
          Linux-x86_64) platform=linux-x64; archive_sha=4aa3c5c7fa24898d8227b087dd393eb2a1463658f0d87e23a72cfe611af83b75 ;;
          *) echo "::error::no pinned Hutch build for $(uname -s)-$(uname -m)"; exit 1 ;;
        esac
        hutch_home="${HUTCH_HOME:-$HOME/.hutch}"
        work="$(mktemp -d)"
        archive="$work/hutch.tar.gz"
        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          "https://hutch.blackboard.sh/hutch/builds/$HUTCH_REVISION/$platform/hutch.tar.gz" --output "$archive"
        # Nothing from the archive runs unless it is the build we reviewed.
        echo "$archive_sha  $archive" | shasum -a 256 -c -

        # From here on, install.sh's own steps, on the verified archive.
        install_root="$hutch_home/releases/hutch/$HUTCH_VERSION/$HUTCH_REVISION/$platform"
        mkdir -p "$(dirname "$install_root")"
        stage="$(mktemp -d "$(dirname "$install_root")/.hutch-install-$platform-XXXXXXXXXXXX")"
        tar -xzf "$archive" --strip-components=1 -C "$stage"
        test -x "$stage/bin/hutch" && test -x "$stage/bin/hutch-engine" && test -f "$stage/hutch-release.json"
        grep -F "\"version\": \"$HUTCH_VERSION\"" "$stage/hutch-release.json" >/dev/null
        grep -F "\"revision\": \"$HUTCH_REVISION\"" "$stage/hutch-release.json" >/dev/null
        grep -F "\"platform\": \"$platform\"" "$stage/hutch-release.json" >/dev/null
        printf '%s' "$archive_sha" > "$stage/.dash-installed"
        cp "$stage/bin/hutch-engine" "$work/hutch-engine"
        HUTCH_HOME="$hutch_home" "$work/hutch-engine" self bootstrap-install production "$stage"
        test -x "$install_root/bin/hutch" && test -x "$install_root/bin/hutch-engine"
        mkdir -p "$hutch_home/bin"
        cp "$install_root/bin/hutch" "$hutch_home/bin/hutch.tmp.$$"
        chmod 755 "$hutch_home/bin/hutch.tmp.$$"
        mv "$hutch_home/bin/hutch.tmp.$$" "$hutch_home/bin/hutch"
        rm -rf "$work"
        if [ -n "${GITHUB_PATH:-}" ]; then echo "$hutch_home/bin" >> "$GITHUB_PATH"; fi
        "$hutch_home/bin/hutch" --version | tee /dev/stderr | grep -F "$HUTCH_VERSION" >/dev/null
