name: Request Copilot Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  request-copilot-review:
    # GitHub revokes write scopes on GITHUB_TOKEN for `pull_request` events
    # fired from forks, so the `requested_reviewers` POST below always 403s
    # on cross-fork PRs. Skip the job outright in that case — it's a no-op
    # anyway — so the check stays green. Maintainers can still request
    # Copilot manually on fork PRs from the UI.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/requested_reviewers \
            -X POST \
            --field 'reviewers[]=Copilot'
