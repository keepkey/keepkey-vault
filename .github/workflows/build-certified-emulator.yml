name: Build Certified Emulator Artifact

on:
  workflow_dispatch:
    inputs:
      firmware_sha:
        description: Exact current fork alpha SHA (optional assertion)
        required: false
        type: string

concurrency:
  group: certify-alpha-emulator-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install deterministic emulator toolchain
        run: |
          python -m pip install nanopb==0.3.9.4.post3 protobuf==3.20.3 requests==2.32.5
          brew install mingw-w64

      - name: Build macOS 13 universal library and Windows x64 library
        env:
          EMU_PYTHON: python
          MACOS_TARGET: '13.0'
          GH_TOKEN: ${{ github.token }}
          EMU_REQUESTED_FIRMWARE_SHA: ${{ inputs.firmware_sha }}
          EMU_STAGE_DIR: ${{ github.workspace }}/projects/keepkey-vault/emulator-bundle
        run: make build-emulator-release

      - name: Audit release libraries
        run: |
          test "$(lipo -archs projects/keepkey-vault/emulator-bundle/libkkemu.dylib)" = "x86_64 arm64" || \
            test "$(lipo -archs projects/keepkey-vault/emulator-bundle/libkkemu.dylib)" = "arm64 x86_64"
          exports="$(nm -gU projects/keepkey-vault/emulator-bundle/libkkemu.dylib)"
          for symbol in kkemu_init kkemu_shutdown kkemu_write kkemu_read kkemu_poll \
            kkemu_is_running kkemu_pop_frame kkemu_start kkemu_stop kkemu_lock \
            kkemu_unlock kkemu_trylock; do
            grep -Eq "[[:space:]]_${symbol}$" <<<"$exports"
          done
          file projects/keepkey-vault/emulator-bundle/libkkemu.dll | grep -q 'x86-64'
          for arch in arm64 x86_64; do
            thin="$(mktemp)"
            lipo projects/keepkey-vault/emulator-bundle/libkkemu.dylib \
              -thin "$arch" -output "$thin"
            minos="$(otool -l "$thin" | awk '
              $1 == "cmd" { command = $2 }
              (command == "LC_BUILD_VERSION" && $1 == "minos") ||
              (command == "LC_VERSION_MIN_MACOSX" && $1 == "version") { print $2; exit }
            ')"
            test "$minos" = 13.0
          done
          shasum -a 256 projects/keepkey-vault/emulator-bundle/libkkemu.dylib \
            projects/keepkey-vault/emulator-bundle/libkkemu.dll

      # Never certify an emulator that cannot take a PIN: Desktop's PIN suites
      # run against the library about to be uploaded.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Build Desktop test dependencies
        run: |
          git submodule update --init modules/hdwallet modules/proto-tx-builder modules/device-protocol
          npm install -g yarn
          (cd modules/hdwallet && yarn install --frozen-lockfile && yarn tsc --build)
          (cd modules/proto-tx-builder && git submodule update --init osmosis-frontend && \
            yarn install --frozen-lockfile && npx tsc -p . && test -f dist/index.js)
          make device-protocol-build
          cd projects/keepkey-vault && bun install --frozen-lockfile

      - name: Test PIN entry on the library to certify
        run: make test-emu-pin KK_EMU_DYLIB="$PWD/projects/keepkey-vault/emulator-bundle/libkkemu.dylib"

      - name: Bind qualified libraries to current fork alpha
        run: node scripts/write-alpha-emulator-receipt.mjs "$EMU_ALPHA_SOURCE_RECEIPT"

      - name: Upload immutable certified artifact
        uses: actions/upload-artifact@v4
        with:
          name: certified-emulator-alpha-${{ env.EMU_FIRMWARE_SHA }}
          if-no-files-found: error
          retention-days: 90
          path: |
            projects/keepkey-vault/emulator-bundle/libkkemu.dylib
            projects/keepkey-vault/emulator-bundle/libkkemu.dll
            projects/keepkey-vault/emulator-bundle/source-receipt.json
