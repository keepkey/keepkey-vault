name: Build KeepKey Vault

on:
  push:
    branches: [master, 'release/*']
    # NOTE: deliberately NOT triggering on tag push. action-gh-release creates
    # the v* tag when it creates the draft release, which used to trigger a
    # SECOND CI run on the tag ref. That rerun rebuilt the unsigned macOS x64
    # tar.zst (plus Linux artifacts and SHA256SUMS.txt) and uploaded them with
    # clobber — destroying the signed tar.zst that sign-release-intel had just
    # placed. v1.2.16 release hit this and had to be manually repaired.
    # If you ever need to re-run CI on a tag, use workflow_dispatch.
  pull_request:
    branches: [master, 'release/*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.5'
  NODE_VERSION: '20'

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            artifact-suffix: linux-x64

          - name: macOS
            runner: macos-14
            artifact-suffix: macos
            expected-arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: git submodule update --init modules/hdwallet modules/proto-tx-builder modules/device-protocol modules/electrobun

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js (for yarn / hdwallet build)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Cache proto-tx-builder
        uses: actions/cache@v4
        with:
          path: modules/proto-tx-builder/node_modules
          key: proto-tx-builder-${{ runner.os }}-${{ hashFiles('modules/proto-tx-builder/package.json') }}

      - name: Cache hdwallet
        uses: actions/cache@v4
        with:
          path: |
            modules/hdwallet/node_modules
            modules/hdwallet/packages/*/dist
          key: hdwallet-${{ runner.os }}-${{ hashFiles('modules/hdwallet/yarn.lock') }}

      - name: Cache vault node_modules
        uses: actions/cache@v4
        with:
          path: projects/keepkey-vault/node_modules
          key: vault-${{ runner.os }}-${{ hashFiles('projects/keepkey-vault/package.json') }}

      - name: Cache Rust/Cargo (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/keepkey-vault/zcash-cli/target
          key: zcash-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/keepkey-vault/zcash-cli/Cargo.lock') }}

      - name: Build modules (hdwallet + proto-tx-builder)
        shell: bash
        run: |
          cd modules/hdwallet
          yarn install --frozen-lockfile
          yarn tsc --build

          cd ../proto-tx-builder
          bun install
          git submodule update --init osmosis-frontend
          npx tsc -p .
          test -f dist/index.js

      - name: Populate device-protocol lib/
        shell: bash
        run: |
          # device-protocol/lib/ is gitignored — protobuf build output.
          # Copy pre-built lib/ from hdwallet's resolved npm copy.
          # hdwallet's yarn.lock pins the exact device-protocol version it was
          # built/tested against, so its lib/ is the correct wire format.
          if [ -f modules/device-protocol/lib/messages_pb.js ]; then
            echo "device-protocol lib/ already present"
            exit 0
          fi

          HDWALLET_DP="modules/hdwallet/node_modules/@keepkey/device-protocol"

          if [ ! -d "$HDWALLET_DP" ] || [ ! -f "$HDWALLET_DP/lib/messages_pb.js" ]; then
            echo "FATAL: device-protocol lib/ missing and no hdwallet copy available"
            echo "Build on macOS first: cd modules/device-protocol && npm install && npm run build"
            exit 1
          fi

          SUBMOD_VER=$(node -p "require('./modules/device-protocol/package.json').version" 2>/dev/null || echo "unknown")
          HDWALLET_VER=$(node -p "require('./$HDWALLET_DP/package.json').version" 2>/dev/null || echo "unknown")
          echo "Submodule package.json: $SUBMOD_VER"
          echo "hdwallet resolved npm:  $HDWALLET_VER"
          if [ "$SUBMOD_VER" != "$HDWALLET_VER" ]; then
            echo "WARNING: version strings differ (git vs npm) — this is expected when"
            echo "the npm publish was from a version-bump commit not on the submodule branch."
            echo "Using hdwallet's resolved copy (it matches what hdwallet was built against)."
          fi

          echo "Copying lib/ from hdwallet's resolved device-protocol..."
          rm -rf modules/device-protocol/lib
          cp -r "$HDWALLET_DP/lib" modules/device-protocol/lib
          JS_COUNT=$(ls modules/device-protocol/lib/*.js 2>/dev/null | wc -l)
          echo "Done — $JS_COUNT JS files"
          if [ "$JS_COUNT" -lt 1 ]; then
            echo "FATAL: cp succeeded but 0 JS files in lib/ — cache may be stale"
            echo "Try clearing the hdwallet cache or rebuild locally"
            exit 1
          fi

      - name: Install vault dependencies
        run: cd projects/keepkey-vault && bun install
        shell: bash

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot lintian dpkg-dev

      - name: Build zcash-cli sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== Building zcash-cli for $(uname -m) ==="
          cd projects/keepkey-vault/zcash-cli
          cargo test
          cargo build --release
          file target/release/zcash-cli

      - name: Build unsigned app (CI mode)
        env:
          CI: 'true'
        run: cd projects/keepkey-vault && bun run build:stable
        shell: bash

      - name: Prune app bundle
        run: cd projects/keepkey-vault && bun scripts/prune-app-bundle.ts
        shell: bash

      - name: Verify binary architecture (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          EXPECTED="${{ matrix.expected-arch }}"
          echo "=== Verifying macOS binary architecture (expecting $EXPECTED) ==="

          TAR_ZST=$(find projects/keepkey-vault/artifacts -name "*.app.tar.zst" | head -1)
          if [ -z "$TAR_ZST" ]; then echo "::error::No .app.tar.zst found"; exit 1; fi

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          LAUNCHER=$(tar tf "$WORK/app.tar" | grep "MacOS/launcher$" | head -1)
          BUN_BIN=$(tar tf "$WORK/app.tar" | grep "MacOS/bun$" | head -1)

          if [ -z "$LAUNCHER" ]; then echo "::error::No launcher binary found in archive"; exit 1; fi
          tar xf "$WORK/app.tar" -C "$WORK/" "$LAUNCHER"
          if [ -n "$BUN_BIN" ]; then tar xf "$WORK/app.tar" -C "$WORK/" "$BUN_BIN"; fi

          echo "Checking binaries:"
          for BIN in "$WORK/$LAUNCHER" "$WORK/$BUN_BIN"; do
            [ -f "$BIN" ] || continue
            ACTUAL=$(lipo -archs "$BIN" 2>/dev/null)
            NAME=$(basename "$BIN")
            echo "  $NAME: $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::Architecture mismatch! $NAME is $ACTUAL but expected $EXPECTED"
              exit 1
            fi
          done

          # Also verify node-hid prebuild matches
          HID_DIR=$(tar tf "$WORK/app.tar" | grep "node-hid/prebuilds/HID-darwin" | head -1)
          if [ -n "$HID_DIR" ]; then
            echo "  node-hid prebuild dir: $(dirname $HID_DIR | xargs basename)"
          fi

          echo "Architecture verified: $EXPECTED"

      # Note: we intentionally do NOT create an arm64 DMG in CI. arm64 builds
      # are produced locally via `make build-signed` (signed + notarized).
      # CI only ships the Intel x86_64 DMG (we have no Intel Mac for local builds).

      - name: Create x86_64 variant (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          echo "=== Creating x86_64 variant from ARM64 build ==="

          # Download x64 Electrobun core from keepkey/keepkey-vault releases.
          # Built locally via `make build-electrobun-x64-core` (cross-compiled from upstream source).
          # Targets macOS 13.0+, Bun 1.3.9, adhoc-signed binaries.
          #
          # IMPORTANT: When bumping modules/electrobun, rebuild + republish the x64 core:
          #   make publish-electrobun-x64-core
          # Then update X64_CORE_TAG below to match ELECTROBUN_X64_TAG in the Makefile.
          X64_CORE_TAG="electrobun-x64-core-v1"

          # Warn if the submodule was bumped but the x64 core tag wasn't updated.
          # The release description includes the submodule version it was built from.
          SUBMOD_VER=$(cd modules/electrobun && git describe --tags --always 2>/dev/null || git rev-parse --short HEAD)
          echo "Electrobun submodule: $SUBMOD_VER, x64 core tag: $X64_CORE_TAG"
          RELEASE_NOTES=$(gh release view "$X64_CORE_TAG" --repo keepkey/keepkey-vault --json body --jq '.body' 2>/dev/null || echo "")
          if [ -n "$RELEASE_NOTES" ] && ! echo "$RELEASE_NOTES" | grep -q "$SUBMOD_VER"; then
            echo "::warning::x64 core ($X64_CORE_TAG) may not match submodule ($SUBMOD_VER). Run 'make publish-electrobun-x64-core' and update X64_CORE_TAG."
          fi

          echo "Downloading Electrobun x64 core from keepkey/keepkey-vault @ $X64_CORE_TAG..."
          curl -fsSL "https://github.com/keepkey/keepkey-vault/releases/download/${X64_CORE_TAG}/electrobun-core-darwin-x64.tar.gz" \
            -o /tmp/electrobun-core-x64.tar.gz
          mkdir -p /tmp/electrobun-x64
          tar xzf /tmp/electrobun-core-x64.tar.gz -C /tmp/electrobun-x64/

          # Find the directory containing the x64 binaries (handles nested or flat tar structure)
          X64_BIN_DIR=$(find /tmp/electrobun-x64 -name "launcher" -type f -exec dirname {} \; | head -1)
          if [ -z "$X64_BIN_DIR" ]; then echo "::error::No launcher found in electrobun-core-x64"; exit 1; fi
          echo "x64 binaries at: $X64_BIN_DIR"
          ls "$X64_BIN_DIR/"

          # Find the ARM64 tar.zst
          ARM64_TAR=$(find projects/keepkey-vault/artifacts -name "*.app.tar.zst" | head -1)
          if [ -z "$ARM64_TAR" ]; then echo "::error::No ARM64 tar.zst found"; exit 1; fi
          echo "Source: $ARM64_TAR"

          # Extract the ARM64 .app
          WORK=$(mktemp -d)
          zstd -d "$ARM64_TAR" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          rm "$WORK/app.tar"

          APP=$(find "$WORK" -name "*.app" -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then echo "::error::No .app found after extraction"; exit 1; fi

          # Swap Electrobun runtime binaries with x64 versions
          echo "Swapping Electrobun binaries for x86_64..."
          for BIN in launcher bun libNativeWrapper.dylib libasar.dylib; do
            SRC="$X64_BIN_DIR/$BIN"
            DEST=$(find "$APP" -name "$BIN" -type f | head -1)
            if [ -f "$SRC" ] && [ -n "$DEST" ]; then
              cp "$SRC" "$DEST"
              ARCH=$(lipo -archs "$DEST" 2>/dev/null || echo "non-macho")
              echo "  $BIN: $ARCH"
            elif [ -f "$SRC" ]; then
              echo "  $BIN: not found in .app (skipping)"
            fi
          done

          # Remove zcash-cli from x64 bundle (Zcash shielded not supported on Intel)
          ZCASH_DEST=$(find "$APP" -name "zcash-cli" -type f | head -1)
          if [ -n "$ZCASH_DEST" ]; then
            rm "$ZCASH_DEST"
            echo "  zcash-cli: removed (Intel not supported)"
          fi

          # Verify key binaries are now x86_64
          echo "Verifying swapped binaries:"
          FAIL=0
          for BIN in launcher bun; do
            FOUND=$(find "$APP" -name "$BIN" -path "*/MacOS/*" | head -1)
            if [ -n "$FOUND" ]; then
              ACTUAL=$(lipo -archs "$FOUND" 2>/dev/null)
              echo "  $BIN: $ACTUAL"
              if [ "$ACTUAL" != "x86_64" ]; then
                echo "::error::$BIN is $ACTUAL, expected x86_64"
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" = "1" ]; then exit 1; fi

          # Verify libNativeWrapper has no resign-swizzle (macOS 12 crash fix)
          NATIVE_LIB=$(find "$APP" -name "libNativeWrapper.dylib" | head -1)
          if [ -n "$NATIVE_LIB" ] && nm "$NATIVE_LIB" 2>/dev/null | grep -q "resignKeyWindow"; then
            echo "::error::libNativeWrapper.dylib contains resign-swizzle symbols (will crash on macOS 12)"
            exit 1
          fi
          echo "  libNativeWrapper: no resign-swizzle (macOS 12 safe)"

          # Re-pack as x64 tar.zst
          X64_TAR="projects/keepkey-vault/artifacts/stable-macos-x64-keepkey-vault.app.tar.zst"
          (cd "$WORK" && tar cf - "$(basename "$APP")") | zstd -o "$X64_TAR" --force
          echo "Created: $X64_TAR ($(du -h "$X64_TAR" | cut -f1))"

          # Cleanup
          rm -rf "$WORK" /tmp/electrobun-x64 /tmp/electrobun-core-x64.tar.gz

      # Note: we intentionally do NOT create an unsigned x86_64 DMG in CI.
      # sign-release-intel downloads the x64 tar.zst, signs it, and builds
      # the DMG from the signed tar.zst. Shipping an unsigned DMG just
      # risks clobbering the signed DMG on a CI re-run.

      - name: Remove arm64 macOS artifacts (CI ships x64 only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # arm64 macOS is built+signed locally via `make build-signed`.
          # Delete all arm64 artifacts so CI doesn't upload them to the release
          # and clobber the locally-signed versions.
          cd projects/keepkey-vault/artifacts
          echo "=== Before cleanup ==="
          ls -la
          rm -f KeepKey-Vault-*-arm64.dmg
          rm -f stable-macos-arm64-keepkey-vault.app.tar.zst
          rm -f stable-macos-arm64-keepkey-vault.dmg
          rm -f stable-macos-arm64-update.json
          rm -f stable-macos-arm64-*.patch
          echo "=== After cleanup ==="
          ls -la

      - name: Substitute Electrobun Linux core (lower glibc floor)
        if: runner.os == 'Linux'
        env:
          # Tag of our self-built Electrobun core on this repo. Built on
          # ubuntu-22.04 against glibc 2.35 so Vault works on Debian 12,
          # Ubuntu 22.04, RHEL/Rocky 9, Mint 21, etc. — distros that the
          # upstream-shipped libNativeWrapper.so (glibc 2.38) excludes.
          # Republish via: make publish-electrobun-linux-x64-core
          ELECTROBUN_LINUX_CORE_TAG: 'electrobun-linux-x64-core-v1'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping core substitution"; exit 0; fi

          # Try to download our self-built core. If the release doesn't exist
          # yet, don't fail — the audit step downstream will still catch the
          # high-glibc upstream binary. This makes the first push to a fresh
          # branch land cleanly even before the publish workflow has run.
          CORE_URL="https://github.com/${{ github.repository }}/releases/download/${ELECTROBUN_LINUX_CORE_TAG}/electrobun-core-linux-x64.tar.gz"
          CORE_TGZ=$(mktemp --suffix=.tar.gz)
          if ! curl -fsSL -o "$CORE_TGZ" "$CORE_URL"; then
            echo "::warning::Could not fetch $CORE_URL — using upstream-shipped libNativeWrapper.so (glibc 2.38)."
            echo "::warning::Run 'make publish-electrobun-linux-x64-core' to build + publish a glibc 2.35 core."
            rm -f "$CORE_TGZ"
            exit 0
          fi

          echo "Fetched $(du -h "$CORE_TGZ" | cut -f1) of Electrobun Linux core"

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK" "$CORE_TGZ"' EXIT
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          APP_DIR=$(find "$WORK" -maxdepth 1 -type d -name "keepkey-vault" | head -1)
          [ -n "$APP_DIR" ] || { echo "::error::no keepkey-vault dir in tar.zst"; exit 1; }

          BIN_DIR="$APP_DIR/bin"
          [ -d "$BIN_DIR" ] || { echo "::error::no bin/ dir at $BIN_DIR"; exit 1; }

          # Extract core tarball into a staging dir so we can preview what's there.
          STAGE="$WORK/core"
          mkdir -p "$STAGE"
          tar xzf "$CORE_TGZ" -C "$STAGE"
          echo "Core tarball contents:"
          ls -la "$STAGE"

          # Substitute every file from the core into bin/ (overwrite). Preserve
          # mode + ownership of the original layout. Files we expect:
          #   launcher, extractor, libNativeWrapper.so, libNativeWrapper_cef.so,
          #   libasar.so, (optionally) bun
          for src in "$STAGE"/*; do
            name=$(basename "$src")
            dst="$BIN_DIR/$name"
            if [ -e "$dst" ]; then
              echo "  replace bin/$name"
            else
              echo "  add     bin/$name"
            fi
            install -m 0755 "$src" "$dst"
          done

          # Repack tar.zst — same name, original location.
          (cd "$WORK" && tar cf "$WORK/app.tar" "$(basename "$APP_DIR")")
          zstd -19 -o "$TAR_ZST" --force "$WORK/app.tar"
          echo "Repacked $TAR_ZST ($(du -h "$TAR_ZST" | cut -f1))"

      - name: Audit Linux glibc footprint
        if: runner.os == 'Linux'
        env:
          # Highest GLIBC_ symbol allowed in any ELF inside the bundle.
          # 2.38 = upstream Electrobun libNativeWrapper.so floor (excludes Debian 12 etc).
          # 2.35 = ubuntu-22.04 floor; reachable once electrobun-linux-x64-core-v1 is published
          #        and the substitute step above runs successfully.
          # Set to 2.38 for now; ratchet to 2.35 after the first successful publish run.
          LINUX_GLIBC_FLOOR: '2.38'
        shell: bash {0}  # disable -e + pipefail; we manage exit code ourselves
        run: |
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping audit"; exit 0; fi

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"

          FLOOR="${LINUX_GLIBC_FLOOR}"

          # version_gt A B  -> exit 0 if A > B (semver-ish, two components)
          version_gt() {
            [ "$1" = "$2" ] && return 1
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]
          }

          REPORT=$(mktemp)
          ERRORS=$(mktemp)
          {
            echo "## Linux glibc footprint (floor: $FLOOR)"
            echo ""
            echo "| File | Max GLIBC | Status |"
            echo "|------|-----------|--------|"
          } >> "$REPORT"

          # Find candidate ELF files: shared libs, .node addons, and executables.
          # Use null-delimited list to handle any path; never let find errors abort.
          find "$WORK" -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.node' -o -perm /u+x \) \
            ! -name '*.js' ! -name '*.json' ! -name '*.ts' ! -name '*.tsx' \
            ! -name '*.png' ! -name '*.html' ! -name '*.css' ! -name '*.md' \
            ! -name '*.txt' ! -name '*.svg' ! -name '*.ico' ! -name '*.icns' \
            -print0 2>/dev/null | sort -z > /tmp/candidates.lst

          fail=0
          examined=0
          while IFS= read -r -d '' f; do
            # ELF magic = 0x7F 'E' 'L' 'F' as the first 4 bytes
            magic=$(head -c 4 "$f" 2>/dev/null | xxd -p 2>/dev/null)
            [ "$magic" = "7f454c46" ] || continue

            examined=$((examined + 1))
            rel="${f#$WORK/}"

            # Extract numeric GLIBC versions only — skip GLIBC_PRIVATE etc.
            max=$(strings "$f" 2>/dev/null \
                    | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                    | sed 's/^GLIBC_//' \
                    | sort -V \
                    | tail -1)

            if [ -z "$max" ]; then
              echo "| \`$rel\` | (none) | OK |" >> "$REPORT"
              continue
            fi

            if version_gt "$max" "$FLOOR"; then
              echo "| \`$rel\` | $max | **EXCEEDS FLOOR** |" >> "$REPORT"
              echo "$rel requires GLIBC_$max (floor: $FLOOR)" >> "$ERRORS"
              fail=1
            else
              echo "| \`$rel\` | $max | OK |" >> "$REPORT"
            fi
          done < /tmp/candidates.lst

          echo "" >> "$REPORT"
          echo "_Examined $examined ELF files._" >> "$REPORT"

          # Emit report to both job log and GitHub step summary
          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" = "1" ]; then
            echo ""
            echo "Files exceeding the floor:"
            sed 's/^/  - /' "$ERRORS"
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$ERRORS"
            echo "::error::Linux glibc audit failed — one or more ELFs exceed the floor of $FLOOR"
            exit 1
          fi
          echo "All $examined ELF files within glibc floor of $FLOOR."

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Extract the app from tar.zst
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping AppImage"; exit 0; fi

          WORK=$(mktemp -d)
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          rm "$WORK/app.tar"
          APP_DIR=$(find "$WORK" -maxdepth 1 -type d -name "keepkey-vault" | head -1)
          if [ -z "$APP_DIR" ]; then echo "No keepkey-vault dir found after extraction"; exit 1; fi

          # Build AppImage structure
          APPDIR="$WORK/KeepKey-Vault.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy app contents
          cp -r "$APP_DIR"/* "$APPDIR/usr/bin/"

          # Icon
          cp "$APPDIR/usr/bin/Resources/appIcon.png" "$APPDIR/keepkey-vault.png"
          cp "$APPDIR/usr/bin/Resources/appIcon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/keepkey-vault.png"

          # Desktop file
          cat > "$APPDIR/keepkey-vault.desktop" <<DESKTOP
          [Desktop Entry]
          Name=KeepKey Vault
          Exec=AppRun
          Icon=keepkey-vault
          Type=Application
          Categories=Finance;Utility;
          Comment=Desktop companion for KeepKey hardware wallet
          DESKTOP
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "$APPDIR/keepkey-vault.desktop"

          # AppRun launcher
          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          exec "$HERE/usr/bin/bin/launcher" "$@"
          APPRUN
          sed -i 's/^          //' "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Download appimagetool
          curl -fsSL -o "$WORK/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$WORK/appimagetool"

          # Build AppImage (--appimage-extract-and-run for CI without FUSE)
          ARCH=x86_64 "$WORK/appimagetool" --appimage-extract-and-run "$APPDIR" "KeepKey-Vault-x86_64.AppImage"

          # Cleanup
          rm -rf "$WORK"

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping .deb"; exit 0; fi

          VERSION=$(node -p "require('../package.json').version")
          PKG="keepkey-vault"
          ARCH="amd64"
          DEB_NAME="${PKG}_${VERSION}_${ARCH}.deb"

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          # The bundle's tar extracts to $WORK/keepkey-vault, so stage the .deb
          # under a different name to avoid the cp recursing into itself.
          ROOT="$WORK/deb-root"

          # Extract bundle
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          APP_SRC=$(find "$WORK" -maxdepth 1 -type d -name "keepkey-vault" | head -1)
          [ -n "$APP_SRC" ] || { echo "::error::No keepkey-vault dir in tarball"; exit 1; }

          # /opt/keepkey-vault/<bundle> + /usr/bin shim + .desktop + icon + udev
          mkdir -p "$ROOT/opt/keepkey-vault" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps" \
                   "$ROOT/usr/share/doc/$PKG" \
                   "$ROOT/lib/udev/rules.d" \
                   "$ROOT/DEBIAN"

          cp -a "$APP_SRC"/. "$ROOT/opt/keepkey-vault/"

          # All file content is written via printf below to avoid YAML-indented
          # heredoc whitespace bleed (a 10-space prefix in dpkg control == invalid).
          # Each block is one printf with explicit \n line breaks.

          # /usr/bin shim
          printf '%s\n' \
            '#!/bin/sh' \
            'exec /opt/keepkey-vault/bin/launcher "$@"' \
            > "$ROOT/usr/bin/keepkey-vault"
          chmod 0755 "$ROOT/usr/bin/keepkey-vault"

          # Icon
          if [ -f "$ROOT/opt/keepkey-vault/Resources/appIcon.png" ]; then
            cp "$ROOT/opt/keepkey-vault/Resources/appIcon.png" \
               "$ROOT/usr/share/icons/hicolor/256x256/apps/keepkey-vault.png"
          fi

          # .desktop
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=KeepKey Vault' \
            'Exec=/usr/bin/keepkey-vault %U' \
            'Icon=keepkey-vault' \
            'Type=Application' \
            'Categories=Finance;Utility;' \
            'Comment=Desktop companion for KeepKey hardware wallet' \
            'Terminal=false' \
            > "$ROOT/usr/share/applications/keepkey-vault.desktop"

          # udev rules — let regular users access KeepKey USB without root
          printf '%s\n' \
            '# KeepKey hardware wallet' \
            '# Vendor 0x2B24, PIDs: 0x0001 (HID legacy), 0x0002 (USB/WebUSB modern)' \
            'SUBSYSTEM=="usb", ATTRS{idVendor}=="2b24", MODE="0666", GROUP="plugdev"' \
            'KERNEL=="hidraw*", ATTRS{idVendor}=="2b24", MODE="0666", GROUP="plugdev"' \
            > "$ROOT/lib/udev/rules.d/51-keepkey.rules"

          # Copyright stub (lintian wants one)
          printf '%s\n' \
            'Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/' \
            'Upstream-Name: KeepKey Vault' \
            'Source: https://github.com/keepkey/keepkey-vault' \
            '' \
            'Files: *' \
            'Copyright: KEY HODLERS LLC' \
            'License: Proprietary' \
            > "$ROOT/usr/share/doc/$PKG/copyright"

          # Compute installed size in KB (excluding DEBIAN dir)
          SIZE_KB=$(du -sk "$ROOT" --exclude=DEBIAN | cut -f1)

          # DEBIAN/control — printf so no leading whitespace creeps in
          {
            printf 'Package: %s\n' "$PKG"
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: utils\n'
            printf 'Priority: optional\n'
            printf 'Architecture: %s\n' "$ARCH"
            printf 'Installed-Size: %s\n' "$SIZE_KB"
            printf 'Depends: libc6 (>= 2.38), libgtk-3-0, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37, libayatana-appindicator3-1 | libappindicator3-1\n'
            printf 'Recommends: udev\n'
            printf 'Maintainer: KEY HODLERS LLC <support@keepkey.com>\n'
            printf 'Homepage: https://keepkey.com\n'
            printf 'Description: Desktop companion for KeepKey hardware wallet\n'
            printf ' KeepKey Vault is the official desktop application for managing your\n'
            printf ' KeepKey hardware wallet. Send and receive crypto, manage assets across\n'
            printf ' multiple chains, and swap between supported tokens.\n'
          } > "$ROOT/DEBIAN/control"

          # postinst — refresh icon + udev caches
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'if command -v gtk-update-icon-cache >/dev/null 2>&1; then' \
            '  gtk-update-icon-cache -q -f /usr/share/icons/hicolor || true' \
            'fi' \
            'if command -v update-desktop-database >/dev/null 2>&1; then' \
            '  update-desktop-database -q /usr/share/applications || true' \
            'fi' \
            'if command -v udevadm >/dev/null 2>&1; then' \
            '  udevadm control --reload-rules || true' \
            '  udevadm trigger --subsystem-match=usb --attr-match=idVendor=2b24 || true' \
            'fi' \
            'exit 0' \
            > "$ROOT/DEBIAN/postinst"
          chmod 0755 "$ROOT/DEBIAN/postinst"

          # postrm — refresh icon cache after removal
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'if command -v gtk-update-icon-cache >/dev/null 2>&1; then' \
            '  gtk-update-icon-cache -q -f /usr/share/icons/hicolor || true' \
            'fi' \
            'if command -v update-desktop-database >/dev/null 2>&1; then' \
            '  update-desktop-database -q /usr/share/applications || true' \
            'fi' \
            'exit 0' \
            > "$ROOT/DEBIAN/postrm"
          chmod 0755 "$ROOT/DEBIAN/postrm"

          # Sanity-print the control file before building
          echo "=== DEBIAN/control ==="
          cat "$ROOT/DEBIAN/control"
          echo "=== layout (sample) ==="
          find "$ROOT" -maxdepth 3 -type d | sort

          # Build .deb (xz compression for size; fakeroot so ownership is root:root)
          fakeroot dpkg-deb --build -Zxz "$ROOT" "$DEB_NAME"
          ls -lh "$DEB_NAME"

          # Sanity-check with lintian (warnings only — don't fail the build)
          if command -v lintian >/dev/null 2>&1; then
            lintian --suppress-tags binary-without-manpage,no-changelog "$DEB_NAME" || true
          fi

      - name: Generate checksums
        run: |
          cd projects/keepkey-vault/artifacts
          shasum -a 256 * > SHA256SUMS-${{ matrix.artifact-suffix }}.txt 2>/dev/null || true
          cat SHA256SUMS-${{ matrix.artifact-suffix }}.txt

      - name: List artifacts
        run: ls -lh projects/keepkey-vault/artifacts/
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keepkey-vault-${{ matrix.artifact-suffix }}-${{ github.sha }}
          path: |
            projects/keepkey-vault/artifacts/*
          retention-days: 30

  release:
    name: Create Draft Release
    needs: build
    if: (!cancelled()) && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Derive release tag
        id: tag
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            VERSION="${REF#refs/heads/release/}"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd artifacts
          # Remove per-platform checksum files (will regenerate combined)
          rm -f SHA256SUMS-*.txt SHA256SUMS.txt
          # Generate checksums for release-worthy files only
          shasum -a 256 *.dmg *.AppImage *.deb *.exe *.tar.zst 2>/dev/null > SHA256SUMS.txt || true
          echo "=== Release checksums ==="
          cat SHA256SUMS.txt

      - name: List release artifacts
        run: find artifacts -type f | sort

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          name: KeepKey Vault ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
