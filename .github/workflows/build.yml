name: Build KeepKey Vault

on:
  push:
    branches: [master, develop, 'release/*']
    # NOTE: deliberately NOT triggering on tag push. action-gh-release creates
    # the v* tag when it creates the draft release, which used to trigger a
    # SECOND CI run on the tag ref. That rerun rebuilt the unsigned macOS x64
    # tar.zst (plus Linux artifacts and SHA256SUMS.txt) and uploaded them with
    # clobber — destroying the signed tar.zst that sign-release-intel had just
    # placed. v1.2.16 release hit this and had to be manually repaired.
    # If you ever need to re-run CI on a tag, use workflow_dispatch.
  pull_request:
    branches: [master, develop, 'release/*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Host scripts and tests. Two Solana certified-envelope tests fail when the
  # host install and tests run on 1.4.4 (run 43550115521: "token mint must
  # decode to exactly 32 bytes, got 33"); keep develop's green version until
  # that is understood.
  BUN_VERSION: '1.3.14'
  # The Bun Hutch packs into the app (fork devkit toolchains.bun).
  PACKAGED_BUN_VERSION: '1.4.4'
  NODE_VERSION: '20'
  MACOS_DEPLOYMENT_TARGET: '13.0'
  EMU_RELEASE_VERSION: '7.17.0'
  EMU_SOURCE_RUN_ID: '42312167033'
  EMU_SOURCE_SHA: 'c19a995b4045704494959f7885fc3ade63c32a19'
  EMU_SOURCE_ARTIFACT: 'certified-emulator-7.17.0-macos13-c19a995b4045704494959f7885fc3ade63c32a19'

jobs:
  # Electrobun 2.x devkit (launcher, core, native wrapper, update manager and
  # helpers) built from the pinned modules/electrobun (keepkey/electrobun
  # keepkey/2.x). Hutch packs it into the app via HUTCH_ELECTROBUN_DEVKIT_ROOT.
  # Each platform builds natively: Electrobun 2.x refuses to cross-compile macOS.
  #   macOS: 13.0 floor (ELECTROBUN_MACOS_DEPLOYMENT_TARGET + rebuilt helpers).
  #   Linux: ubuntu-22.04 for a glibc 2.35 floor. Hutch itself needs glibc 2.38,
  #          so this leg runs the fork's build with plain Bun.
  # Handed to the build job as a workflow artifact — never published as a
  # release: a core release on this repo once became "Latest" and hijacked
  # keepkey.com downloads. Its name must never match keepkey-vault-*.
  devkit:
    name: Electrobun devkit (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Xcode 26: Xcode 16.4's ld fails to link the fork's native wrapper
          # for the 13.0 target ("___dso_handle does not have address").
          - platform: macos-arm64
            runner: macos-26
          - platform: macos-x64
            runner: macos-26-intel
          - platform: linux-x64
            runner: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init modules/electrobun
      - id: pin
        run: echo "sha=$(git rev-parse HEAD:modules/electrobun)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: electrobun-devkit-${{ matrix.platform }}.tar.gz
          key: electrobun-devkit-${{ matrix.platform }}-${{ steps.pin.outputs.sha }}-macos${{ env.MACOS_DEPLOYMENT_TARGET }}-${{ hashFiles('scripts/build-electrobun-macos-helpers.sh', 'scripts/verify-electrobun-devkit.mjs', '.github/actions/install-hutch/action.yml') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          # The fork's build scripts run on the Bun its devkit pins.
          bun-version: ${{ env.PACKAGED_BUN_VERSION }}

      - name: Install Hutch (macOS)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        uses: ./.github/actions/install-hutch
      - name: Build macOS devkit (${{ env.MACOS_DEPLOYMENT_TARGET }} floor)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          make electrobun-macos-helpers electrobun-devkit MACOS_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET"
          # Vault bundles neither CEF nor WGPU.
          tar czf "electrobun-devkit-${{ matrix.platform }}.tar.gz" -C modules/electrobun/package/dist --exclude ./cef .

      - name: Build Linux devkit (glibc 2.35)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        shell: bash
        working-directory: modules/electrobun/package
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev build-essential cmake pkg-config
          npm ci
          # HUTCH_BINARY=bun: the fork's scripts run their Bun steps through Hutch
          # by default; plain Bun is the same runtime without Hutch's glibc 2.38.
          export HUTCH_BINARY=bun
          # Source-level ABI contract: the symbols the TypeScript runtime, the core
          # and the SDKs bind are the ones the native wrappers define.
          node scripts/run-bun-test.js src/shared/native-symbol-contract.test.ts
          # The fork's release packaging: build.ts --release --core-only, then its
          # ELF/manifest verifiers; writes electrobun-core-linux-x64.tar.gz (no CEF).
          node scripts/package-release.js
          mv electrobun-core-linux-x64.tar.gz "$GITHUB_WORKSPACE/electrobun-devkit-${{ matrix.platform }}.tar.gz"

      - name: Verify devkit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/devkit"
          tar xzf "electrobun-devkit-${{ matrix.platform }}.tar.gz" -C "$RUNNER_TEMP/devkit"
          node scripts/verify-electrobun-devkit.mjs "$RUNNER_TEMP/devkit"
          shasum -a 256 "electrobun-devkit-${{ matrix.platform }}.tar.gz"

      # Every ELF that can ship must sit at the 2.35 floor. libwebgpu_dawn.so is
      # a prebuilt (glibc 2.38) the devkit carries for WGPU apps; Vault does not
      # bundle WGPU, and the app's own glibc audit fails if it ever ships.
      - name: Audit devkit glibc footprint (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r -d '' f; do
            [ "$(head -c 4 "$f" | xxd -p)" = 7f454c46 ] || continue
            [ "$(basename "$f")" != libwebgpu_dawn.so ] || continue
            max=$(strings "$f" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/^GLIBC_//' | sort -V | tail -1)
            rel="${f#"$RUNNER_TEMP"/devkit/}"
            echo "  $rel: GLIBC_${max:-none}"
            if [ -n "$max" ] && [ "$(printf '%s\n2.35\n' "$max" | sort -V | tail -1)" != 2.35 ]; then
              echo "::error::$rel requires GLIBC_$max (floor 2.35)"; fail=1
            fi
          done < <(find "$RUNNER_TEMP/devkit" -type f -print0)
          exit $fail

      - uses: actions/upload-artifact@v4
        with:
          name: electrobun-devkit-${{ matrix.platform }}
          path: electrobun-devkit-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    name: Build (${{ matrix.name }})
    needs: devkit
    # Each leg needs only its own devkit (the download fails if it is missing),
    # so one platform's devkit failure does not hide the others' results. The
    # release job still requires every job to succeed.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    continue-on-error: ${{ matrix.experimental || false }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          # Hutch needs glibc 2.38+; the app's ELFs come from the 22.04 devkit.
          - name: Linux x64
            runner: ubuntu-24.04
            devkit: linux-x64
            artifact-suffix: linux-x64
            tests: true

          # Apple Silicon is built and signed locally (make build-signed); this
          # leg tests and audits the same build and ships nothing.
          - name: macOS arm64
            runner: macos-15
            devkit: macos-arm64
            artifact-suffix: macos-arm64
            expected-arch: arm64
            tests: true

          # Intel, built natively. make sign-release-intel signs its tar.zst.
          - name: macOS x64
            runner: macos-15-intel
            devkit: macos-x64
            artifact-suffix: macos-x64
            expected-arch: x86_64
            tests: false

    env:
      HUTCH_ELECTROBUN_DEVKIT_ROOT: ${{ github.workspace }}/.electrobun-devkit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init required submodules
        run: |
          git submodule update --init modules/hdwallet modules/proto-tx-builder modules/device-protocol modules/electrobun

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js (for yarn / hdwallet build)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Hutch
        uses: ./.github/actions/install-hutch

      - name: Download Electrobun devkit
        uses: actions/download-artifact@v4
        with:
          name: electrobun-devkit-${{ matrix.devkit }}
          path: ${{ runner.temp }}/electrobun-devkit

      - name: Extract and verify Electrobun devkit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HUTCH_ELECTROBUN_DEVKIT_ROOT"
          tar xzf "$RUNNER_TEMP/electrobun-devkit/electrobun-devkit-${{ matrix.devkit }}.tar.gz" -C "$HUTCH_ELECTROBUN_DEVKIT_ROOT"
          node scripts/verify-electrobun-devkit.mjs "$HUTCH_ELECTROBUN_DEVKIT_ROOT"

      - name: Cache proto-tx-builder
        uses: actions/cache@v4
        with:
          path: modules/proto-tx-builder/node_modules
          key: proto-tx-builder-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modules/proto-tx-builder/package.json', 'modules/proto-tx-builder/yarn.lock') }}

      - name: Cache hdwallet
        uses: actions/cache@v4
        with:
          path: |
            modules/hdwallet/node_modules
            modules/hdwallet/packages/*/dist
          key: hdwallet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('modules/hdwallet/yarn.lock') }}

      - name: Cache vault node_modules
        uses: actions/cache@v4
        with:
          path: projects/keepkey-vault/node_modules
          key: vault-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/keepkey-vault/package.json', 'projects/keepkey-vault/bun.lock') }}

      - name: Cache Rust/Cargo (macOS arm64)
        if: matrix.expected-arch == 'arm64'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            projects/keepkey-vault/zcash-cli/target
          key: zcash-cli-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('projects/keepkey-vault/zcash-cli/Cargo.lock') }}

      - name: Build modules (hdwallet + proto-tx-builder)
        shell: bash
        run: |
          cd modules/hdwallet
          yarn install --frozen-lockfile
          yarn tsc --build

          cd ../proto-tx-builder
          git submodule update --init osmosis-frontend
          yarn install --frozen-lockfile
          npx tsc -p .
          test -f dist/index.js

      - name: Build device-protocol lib/ from the pinned submodule
        shell: bash
        run: make device-protocol-build

      - name: Install vault dependencies and project the devkit
        # --frozen-lockfile: install exactly what bun.lock pins. Without it, bun
        # floats caret ranges to latest — e.g. @pioneer-platform/pioneer-discovery
        # ^10.0.9 → 10.2.0, which added a strict exports map that blocks the raw
        # `lib/chains.json` subpath import and breaks the vite build.
        # `hutch electrobun sync` projects the devkit's SDK into .hutch/devkit,
        # which tsconfig and every `electrobun/*` import resolve through.
        run: |
          cd projects/keepkey-vault
          test -f bun.lock || { echo "::error::The audited Vault dependency lockfile is missing"; exit 1; }
          bun install --frozen-lockfile
          rm -rf .hutch/devkit .hutch/devkit.lock
          hutch electrobun sync
        shell: bash

      - name: Run Vault unit and submodule-contract tests
        if: matrix.tests
        # Must run after building the pinned modules. The suite imports critical
        # hdwallet wire translators directly, so an incompatible gitlink fails
        # here instead of producing a package with missing account controls.
        run: make test-unit
        shell: bash

      - name: Validate localization and financial locale boundaries
        if: matrix.tests
        shell: bash
        run: |
          cd projects/keepkey-vault
          bun run i18n:check
          bun run i18n:test

      - name: Test Bitcoin-only host boundary (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd projects/keepkey-vault
          bun test \
            src/bun/bitcoin-only-boundary.test.ts \
            src/bun/perf-telemetry-offline.test.ts \
            src/bun/txbuilder/utxo-selfhost-policy.test.ts \
            src/bun/txbuilder/utxo-taproot.test.ts \
            __tests__/taproot-host.test.ts
          bun src/bun/btc-backend/address-discovery.test.ts
          bun src/bun/btc-backend/core.test.ts
          bun src/bun/btc-backend/normalize.test.ts
          bun src/bun/btc-backend/device-only.test.ts
          bun src/bun/offline-policy.test.ts
          bun src/bun/pioneer-guard.test.ts

      - name: Install native build tools (macOS)
        if: matrix.expected-arch == 'arm64'
        # Protoc is required by the Rust Zcash sidecar. The certified emulator
        # is downloaded as an immutable artifact and is never rebuilt here.
        run: brew install protobuf

      - name: Download certified emulator 7.17 artifact
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.EMU_SOURCE_ARTIFACT }}
          path: .certified-emulator-${{ env.EMU_RELEASE_VERSION }}
          github-token: ${{ github.token }}
          repository: keepkey/keepkey-vault
          run-id: ${{ env.EMU_SOURCE_RUN_ID }}

      - name: Stage and verify certified emulator 7.17 libraries
        if: runner.os == 'macOS'
        run: scripts/stage-certified-emulator.sh ".certified-emulator-${EMU_RELEASE_VERSION}"
        shell: bash

      # The emulator Desktop ships must draw the PIN grid and end every PIN
      # wait; the 7.17 alpha certified before firmware #1042 did neither.
      - name: Test PIN entry on the certified emulator
        if: runner.os == 'macOS' && matrix.tests
        run: make test-emu-pin KK_EMU_DYLIB="$PWD/projects/keepkey-vault/emulator-bundle/libkkemu.dylib"
        shell: bash

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot lintian dpkg-dev

      # Apple Silicon only: Intel does not support the shielded sidecar, so the
      # Intel app ships without it and Vault keeps the privacy capability off.
      - name: Build zcash-cli sidecar (macOS arm64)
        if: matrix.expected-arch == 'arm64'
        shell: bash
        run: |
          echo "=== Building zcash-cli for $(uname -m) ==="
          cd projects/keepkey-vault/zcash-cli
          cargo test
          cargo build --release
          file target/release/zcash-cli

      - name: Verify and build Monero CLI sidecar
        shell: bash
        run: |
          cd projects/keepkey-vault
          python3 monero-cli/prepare.py
          bun run monero:build
          bun run monero:test

      - name: Build unsigned app (CI mode)
        env:
          CI: 'true'
          KEEPKEY_REQUIRE_MONERO_SIDECAR: '1'
        run: cd projects/keepkey-vault && bun run build:stable
        shell: bash

      # Hutch packed exactly this archive and its update manifests; postBuild
      # pruning and the camera copy must be in it, and nothing may rewrite it.
      - name: Verify release bundle
        run: cd projects/keepkey-vault && bun scripts/verify-release-bundle.ts stable
        shell: bash

      - name: Smoke-test packaged Monero tools without developer overrides
        shell: bash
        run: |
          MONERO_PACKAGE=$(find "$PWD/projects/keepkey-vault/artifacts" -maxdepth 1 -name '*-keepkey-vault*.tar.zst' -type f | head -1)
          test -n "$MONERO_PACKAGE"
          MONERO_SMOKE_DIR=$(mktemp -d "$RUNNER_TEMP/monero-package-smoke.XXXXXX")
          trap 'rm -rf "$MONERO_SMOKE_DIR"' EXIT
          zstd -d "$MONERO_PACKAGE" -o "$MONERO_SMOKE_DIR/app.tar" --force
          tar xf "$MONERO_SMOKE_DIR/app.tar" -C "$MONERO_SMOKE_DIR"
          MONERO_METADATA=$(find "$MONERO_SMOKE_DIR" -path '*/monero-tools/monero-tools.json' -type f | head -1)
          test -n "$MONERO_METADATA"
          MONERO_APP_DIR=$(dirname "$(dirname "$MONERO_METADATA")")
          cd projects/keepkey-vault
          bun monero-cli/package-smoke.ts --app-dir="$MONERO_APP_DIR"

      - name: Stage Windows emulator build input
        if: matrix.expected-arch == 'arm64'
        run: |
          cp projects/keepkey-vault/emulator-bundle/libkkemu.dll \
            projects/keepkey-vault/artifacts/emulator-build-input-libkkemu-7.17.0-win-x64.dll
          shasum -a 256 projects/keepkey-vault/artifacts/emulator-build-input-libkkemu-7.17.0-win-x64.dll
        shell: bash

      - name: Verify architecture, deployment target and packaged Bun (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="${{ matrix.expected-arch }}"
          make verify-arch EXPECTED_ARCH="$EXPECTED"
          SUFFIX=$([ "$EXPECTED" = x86_64 ] && echo x64 || echo arm64)
          TAR_ZST="projects/keepkey-vault/artifacts/stable-macos-$SUFFIX-keepkey-vault.app.tar.zst"
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          APP=$(find "$WORK" -name "*.app" -maxdepth 1 | head -1)
          test -n "$APP"
          # Every Mach-O (launcher, core, native wrapper, update manager, helpers,
          # native modules, sidecars): this architecture, macOS 13.0 or older.
          ./scripts/audit-macos-bundle.sh "$APP" "$EXPECTED" "$MACOS_DEPLOYMENT_TARGET"
          # Regression guard from the macOS 12 crash: no resign-swizzle.
          if nm "$APP/Contents/MacOS/libNativeWrapper.dylib" 2>/dev/null | grep -q "resignKeyWindow"; then
            echo "::error::libNativeWrapper.dylib contains resign-swizzle symbols (will crash on macOS 12)"
            exit 1
          fi
          BUN_REPORTED=$("$APP/Contents/MacOS/bun" --version)
          [ "$BUN_REPORTED" = "$PACKAGED_BUN_VERSION" ] || { echo "::error::packaged Bun is $BUN_REPORTED, expected $PACKAGED_BUN_VERSION"; exit 1; }
          echo "Packaged Bun $BUN_REPORTED"

      - name: Keep only shippable macOS artifacts
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cd projects/keepkey-vault/artifacts
          echo "=== Before cleanup ==="
          ls -la
          if [ "${{ matrix.expected-arch }}" = arm64 ]; then
            # arm64 macOS is built+signed locally via `make build-signed`. Ship
            # nothing arm64 from CI, whatever Hutch names it, so CI never
            # clobbers the locally signed files on the draft release.
            rm -rf -- *arm64*
          else
            # make sign-release-intel re-signs and re-packs this archive, so
            # update manifests describing these unsigned bytes must not ship.
            rm -f -- stable-macos-x64-update.json stable-macos-x64-update-v2.json stable-macos-x64-*.patch *.dmg
            test -f stable-macos-x64-keepkey-vault.app.tar.zst
          fi
          echo "=== After cleanup ==="
          ls -la
          if [ -n "$(find . -maxdepth 1 -iname '*arm64*')" ]; then echo "::error::arm64 artifacts must not leave CI"; exit 1; fi
          if [ -n "$(find . -maxdepth 1 \( -name '*.json' -o -name '*.patch' -o -name '*.dmg' \))" ]; then echo "::error::unexpected macOS artifact"; exit 1; fi

      - name: Audit Linux glibc footprint
        if: runner.os == 'Linux'
        env:
          # Highest GLIBC_ symbol allowed in any ELF inside the bundle.
          # 2.35 = ubuntu-22.04 floor, reached via our Electrobun devkit built
          #        on ubuntu-22.04 (devkit job, from the pinned submodule).
          #        Covers Debian 12, Ubuntu 22.04 LTS, RHEL/Rocky 9, Mint 21,
          #        Pop!_OS 22.04.
          LINUX_GLIBC_FLOOR: '2.35'
        shell: bash {0}  # disable -e + pipefail; we manage exit code ourselves
        run: |
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping audit"; exit 0; fi

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"

          FLOOR="${LINUX_GLIBC_FLOOR}"

          # version_gt A B  -> exit 0 if A > B (semver-ish, two components)
          version_gt() {
            [ "$1" = "$2" ] && return 1
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]
          }

          REPORT=$(mktemp)
          ERRORS=$(mktemp)
          {
            echo "## Linux glibc footprint (floor: $FLOOR)"
            echo ""
            echo "| File | Max GLIBC | Status |"
            echo "|------|-----------|--------|"
          } >> "$REPORT"

          # Find candidate ELF files: shared libs, .node addons, and executables.
          # Use null-delimited list to handle any path; never let find errors abort.
          find "$WORK" -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.node' -o -perm /u+x \) \
            ! -name '*.js' ! -name '*.json' ! -name '*.ts' ! -name '*.tsx' \
            ! -name '*.png' ! -name '*.html' ! -name '*.css' ! -name '*.md' \
            ! -name '*.txt' ! -name '*.svg' ! -name '*.ico' ! -name '*.icns' \
            -print0 2>/dev/null | sort -z > /tmp/candidates.lst

          fail=0
          examined=0
          while IFS= read -r -d '' f; do
            # ELF magic = 0x7F 'E' 'L' 'F' as the first 4 bytes
            magic=$(head -c 4 "$f" 2>/dev/null | xxd -p 2>/dev/null)
            [ "$magic" = "7f454c46" ] || continue

            examined=$((examined + 1))
            rel="${f#$WORK/}"

            # Extract numeric GLIBC versions only — skip GLIBC_PRIVATE etc.
            max=$(strings "$f" 2>/dev/null \
                    | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
                    | sed 's/^GLIBC_//' \
                    | sort -V \
                    | tail -1)

            if [ -z "$max" ]; then
              echo "| \`$rel\` | (none) | OK |" >> "$REPORT"
              continue
            fi

            if version_gt "$max" "$FLOOR"; then
              echo "| \`$rel\` | $max | **EXCEEDS FLOOR** |" >> "$REPORT"
              echo "$rel requires GLIBC_$max (floor: $FLOOR)" >> "$ERRORS"
              fail=1
            else
              echo "| \`$rel\` | $max | OK |" >> "$REPORT"
            fi
          done < /tmp/candidates.lst

          echo "" >> "$REPORT"
          echo "_Examined $examined ELF files._" >> "$REPORT"

          # Emit report to both job log and GitHub step summary
          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" = "1" ]; then
            echo ""
            echo "Files exceeding the floor:"
            sed 's/^/  - /' "$ERRORS"
            while IFS= read -r line; do
              echo "::error::$line"
            done < "$ERRORS"
            echo "::error::Linux glibc audit failed — one or more ELFs exceed the floor of $FLOOR"
            exit 1
          fi
          echo "All $examined ELF files within glibc floor of $FLOOR."

      - name: Package AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Extract the app from tar.zst
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping AppImage"; exit 0; fi

          WORK=$(mktemp -d)
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          rm "$WORK/app.tar"
          APP_DIR=$(find "$WORK" -maxdepth 1 -type d -name "keepkey-vault" | head -1)
          if [ -z "$APP_DIR" ]; then echo "No keepkey-vault dir found after extraction"; exit 1; fi

          # Build AppImage structure
          APPDIR="$WORK/KeepKey-Vault.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/lib" "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          # Copy app contents
          cp -r "$APP_DIR"/* "$APPDIR/usr/bin/"

          # Bundle the tray stack (Ayatana AppIndicator + dbusmenu): small,
          # self-contained, and absent on default Fedora KDE / minimal installs.
          # It goes next to libNativeWrapper.so in usr/bin/bin: the Electrobun
          # launcher puts that directory first on LD_LIBRARY_PATH, and the
          # native wrapper dlopens AppIndicator when the tray is created.
          # WebKitGTK stays a system dependency — too big and too coupled to the
          # host (helper subprocesses, GStreamer, Mesa) to bundle; AppRun still
          # checks for it and names the package. The .so files come from Ubuntu
          # 22.04 (jammy) debs, not this runner's distro, to respect the glibc
          # 2.35 floor; an audit below enforces that.
          TRAY_PKGS="libayatana-appindicator3-1 libayatana-indicator3-7 libayatana-ido3-0.4-0 libdbusmenu-glib4 libdbusmenu-gtk3-4"
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] http://archive.ubuntu.com/ubuntu jammy main universe" \
            | sudo tee /etc/apt/sources.list.d/kk-jammy-tray.list >/dev/null
          sudo apt-get update
          DEBS="$WORK/tray-debs"
          mkdir -p "$DEBS/x"
          (cd "$DEBS" && apt-get download $(for p in $TRAY_PKGS; do printf '%s/jammy ' "$p"; done))
          # Drop the jammy source immediately: a later apt-get install in this
          # job must never see jammy package candidates.
          sudo rm /etc/apt/sources.list.d/kk-jammy-tray.list
          for deb in "$DEBS"/*.deb; do dpkg-deb -x "$deb" "$DEBS/x"; done

          # Audit before copying: the bundled libs must not raise the glibc
          # floor (2.35; the "Audit Linux glibc footprint" step runs before this
          # one and does not see these files).
          while IFS= read -r -d '' so; do
            max=$(strings "$so" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/^GLIBC_//' | sort -V | tail -1)
            echo "  $(basename "$so") needs GLIBC_${max:-none}"
            if [ -n "$max" ] && [ "$(printf '%s\n2.35\n' "$max" | sort -V | tail -1)" != "2.35" ]; then
              echo "::error::$(basename "$so") requires GLIBC_$max, above the 2.35 floor"
              exit 1
            fi
          done < <(find "$DEBS/x/usr/lib" -type f \( -name '*.so' -o -name '*.so.*' \) -print0)

          find "$DEBS/x/usr/lib" \( -name '*.so' -o -name '*.so.*' \) -exec cp -a {} "$APPDIR/usr/bin/bin/" \;
          for lib in libayatana-appindicator3.so.1 libayatana-indicator3.so.7 libayatana-ido3-0.4.so.0 libdbusmenu-glib.so.4 libdbusmenu-gtk3.so.4; do
            [ -e "$APPDIR/usr/bin/bin/$lib" ] || { echo "::error::expected $lib in AppDir usr/bin/bin"; exit 1; }
          done

          # Icon
          cp "$APPDIR/usr/bin/Resources/appIcon.png" "$APPDIR/keepkey-vault.png"
          cp "$APPDIR/usr/bin/Resources/appIcon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/keepkey-vault.png"

          # Desktop file
          cat > "$APPDIR/keepkey-vault.desktop" <<DESKTOP
          [Desktop Entry]
          Name=KeepKey Vault
          Exec=AppRun
          Icon=keepkey-vault
          Type=Application
          Categories=Finance;Utility;
          Comment=Desktop companion for KeepKey hardware wallet
          DESKTOP
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' "$APPDIR/keepkey-vault.desktop"

          # AppRun launcher: checks for missing system libraries, then starts the app
          cp ../scripts/linux-apprun.sh "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # Download appimagetool
          curl -fsSL -o "$WORK/appimagetool" "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x "$WORK/appimagetool"

          # Build AppImage (--appimage-extract-and-run for CI without FUSE)
          ARCH=x86_64 "$WORK/appimagetool" --appimage-extract-and-run "$APPDIR" "KeepKey-Vault-x86_64.AppImage"

          # Cleanup
          rm -rf "$WORK"

      - name: Package .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cd projects/keepkey-vault/artifacts
          TAR_ZST=$(ls stable-linux-x64-keepkey-vault.tar.zst 2>/dev/null | head -1)
          if [ -z "$TAR_ZST" ]; then echo "No Linux tar.zst found, skipping .deb"; exit 0; fi

          VERSION=$(node -p "require('../package.json').version")
          PKG="keepkey-vault"
          ARCH="amd64"
          DEB_NAME="${PKG}_${VERSION}_${ARCH}.deb"

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          # The bundle's tar extracts to $WORK/keepkey-vault, so stage the .deb
          # under a different name to avoid the cp recursing into itself.
          ROOT="$WORK/deb-root"

          # Extract bundle
          zstd -d "$TAR_ZST" -o "$WORK/app.tar" --force
          tar xf "$WORK/app.tar" -C "$WORK/"
          APP_SRC=$(find "$WORK" -maxdepth 1 -type d -name "keepkey-vault" | head -1)
          [ -n "$APP_SRC" ] || { echo "::error::No keepkey-vault dir in tarball"; exit 1; }

          # /opt/keepkey-vault/<bundle> + /usr/bin shim + .desktop + icon + udev
          mkdir -p "$ROOT/opt/keepkey-vault" \
                   "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps" \
                   "$ROOT/usr/share/doc/$PKG" \
                   "$ROOT/lib/udev/rules.d" \
                   "$ROOT/DEBIAN"

          cp -a "$APP_SRC"/. "$ROOT/opt/keepkey-vault/"

          # All file content is written via printf below to avoid YAML-indented
          # heredoc whitespace bleed (a 10-space prefix in dpkg control == invalid).
          # Each block is one printf with explicit \n line breaks.

          # /usr/bin shim
          printf '%s\n' \
            '#!/bin/sh' \
            'exec /opt/keepkey-vault/bin/launcher "$@"' \
            > "$ROOT/usr/bin/keepkey-vault"
          chmod 0755 "$ROOT/usr/bin/keepkey-vault"

          # Icon
          if [ -f "$ROOT/opt/keepkey-vault/Resources/appIcon.png" ]; then
            cp "$ROOT/opt/keepkey-vault/Resources/appIcon.png" \
               "$ROOT/usr/share/icons/hicolor/256x256/apps/keepkey-vault.png"
          fi

          # .desktop
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=KeepKey Vault' \
            'Exec=/usr/bin/keepkey-vault %U' \
            'Icon=keepkey-vault' \
            'Type=Application' \
            'Categories=Finance;Utility;' \
            'Comment=Desktop companion for KeepKey hardware wallet' \
            'Terminal=false' \
            > "$ROOT/usr/share/applications/keepkey-vault.desktop"

          # udev rules — let regular users access KeepKey USB without root
          printf '%s\n' \
            '# KeepKey hardware wallet' \
            '# Vendor 0x2B24, PIDs: 0x0001 (HID legacy), 0x0002 (USB/WebUSB modern)' \
            'SUBSYSTEM=="usb", ATTRS{idVendor}=="2b24", MODE="0666", GROUP="plugdev"' \
            'KERNEL=="hidraw*", ATTRS{idVendor}=="2b24", MODE="0666", GROUP="plugdev"' \
            > "$ROOT/lib/udev/rules.d/51-keepkey.rules"

          # Copyright stub (lintian wants one)
          printf '%s\n' \
            'Format: https://www.debian.org/doc/packaging-manuals/copyright-format/1.0/' \
            'Upstream-Name: KeepKey Vault' \
            'Source: https://github.com/keepkey/keepkey-vault' \
            '' \
            'Files: *' \
            'Copyright: KEY HODLERS LLC' \
            'License: Proprietary' \
            > "$ROOT/usr/share/doc/$PKG/copyright"

          # Compute installed size in KB (excluding DEBIAN dir)
          SIZE_KB=$(du -sk "$ROOT" --exclude=DEBIAN | cut -f1)

          # DEBIAN/control — printf so no leading whitespace creeps in
          {
            printf 'Package: %s\n' "$PKG"
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: utils\n'
            printf 'Priority: optional\n'
            printf 'Architecture: %s\n' "$ARCH"
            printf 'Installed-Size: %s\n' "$SIZE_KB"
            printf 'Depends: libc6 (>= 2.35), libgtk-3-0, libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37, libayatana-appindicator3-1 | libappindicator3-1\n'
            printf 'Recommends: udev\n'
            printf 'Maintainer: KEY HODLERS LLC <support@keepkey.com>\n'
            printf 'Homepage: https://keepkey.com\n'
            printf 'Description: Desktop companion for KeepKey hardware wallet\n'
            printf ' KeepKey Vault is the official desktop application for managing your\n'
            printf ' KeepKey hardware wallet. Send and receive crypto, manage assets across\n'
            printf ' multiple chains, and swap between supported tokens.\n'
          } > "$ROOT/DEBIAN/control"

          # postinst — refresh icon + udev caches
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'if command -v gtk-update-icon-cache >/dev/null 2>&1; then' \
            '  gtk-update-icon-cache -q -f /usr/share/icons/hicolor || true' \
            'fi' \
            'if command -v update-desktop-database >/dev/null 2>&1; then' \
            '  update-desktop-database -q /usr/share/applications || true' \
            'fi' \
            'if command -v udevadm >/dev/null 2>&1; then' \
            '  udevadm control --reload-rules || true' \
            '  udevadm trigger --subsystem-match=usb --attr-match=idVendor=2b24 || true' \
            'fi' \
            'exit 0' \
            > "$ROOT/DEBIAN/postinst"
          chmod 0755 "$ROOT/DEBIAN/postinst"

          # postrm — refresh icon cache after removal
          printf '%s\n' \
            '#!/bin/sh' \
            'set -e' \
            'if command -v gtk-update-icon-cache >/dev/null 2>&1; then' \
            '  gtk-update-icon-cache -q -f /usr/share/icons/hicolor || true' \
            'fi' \
            'if command -v update-desktop-database >/dev/null 2>&1; then' \
            '  update-desktop-database -q /usr/share/applications || true' \
            'fi' \
            'exit 0' \
            > "$ROOT/DEBIAN/postrm"
          chmod 0755 "$ROOT/DEBIAN/postrm"

          # Sanity-print the control file before building
          echo "=== DEBIAN/control ==="
          cat "$ROOT/DEBIAN/control"
          echo "=== layout (sample) ==="
          find "$ROOT" -maxdepth 3 -type d | sort

          # Build .deb (xz compression for size; fakeroot so ownership is root:root)
          fakeroot dpkg-deb --build -Zxz "$ROOT" "$DEB_NAME"
          ls -lh "$DEB_NAME"

          # Sanity-check with lintian (warnings only — don't fail the build)
          if command -v lintian >/dev/null 2>&1; then
            lintian --suppress-tags binary-without-manpage,no-changelog "$DEB_NAME" || true
          fi

      - name: Generate checksums
        run: |
          cd projects/keepkey-vault/artifacts
          shasum -a 256 * > SHA256SUMS-${{ matrix.artifact-suffix }}.txt 2>/dev/null || true
          cat SHA256SUMS-${{ matrix.artifact-suffix }}.txt

      - name: List artifacts
        run: ls -lh projects/keepkey-vault/artifacts/
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keepkey-vault-${{ matrix.artifact-suffix }}-${{ github.sha }}
          path: |
            projects/keepkey-vault/artifacts/*
          retention-days: 30

  intel-smoke:
    name: Intel macOS packaged-app smoke test
    needs: build
    if: ${{ !cancelled() }}
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4

      - name: Download assembled Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: keepkey-vault-macos-x64-${{ github.sha }}
          path: artifacts

      - name: Extract Intel application
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          TAR="artifacts/stable-macos-x64-keepkey-vault.app.tar.zst"
          test -f "$TAR"
          mkdir -p intel-smoke
          zstd -d "$TAR" -o intel-smoke/app.tar --force
          tar xf intel-smoke/app.tar -C intel-smoke
          APP=$(find "$PWD/intel-smoke" -maxdepth 1 -name '*.app' -type d | head -1)
          test -n "$APP"
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Audit complete Intel bundle
        run: ./scripts/audit-macos-bundle.sh "$APP" x86_64 13.0

      - name: Electrobun runtime is Intel
        shell: bash
        run: |
          set -euo pipefail
          for bin in launcher bun libElectrobunCore.dylib libNativeWrapper.dylib; do
            test "$(lipo -archs "$APP/Contents/MacOS/$bin")" = x86_64
          done
          test "$(lipo -archs "$APP/Contents/Resources/uninstall")" = x86_64

      - name: Load packaged node-hid with packaged Bun
        shell: bash
        run: |
          set -euo pipefail
          cd "$APP/Contents/Resources/app"
          "$APP/Contents/MacOS/bun" -e \
            "await import('node-hid'); console.log('node-hid x64 import passed')"

      - name: Launch packaged Intel application
        shell: bash
        run: |
          set -euo pipefail
          # Exercise the bundle through LaunchServices, matching how Finder and
          # the DMG launch it. Executing a GUI app's Mach-O directly does not
          # provide the macOS application bootstrap context.
          # The launcher staying up is not enough: wait until the Bun backend
          # logs "boot complete" (db, window, engine and sidecar started).
          LOG="$HOME/Library/Application Support/com.keepkey.vault/vault-backend.log"
          START=0; [ -f "$LOG" ] && START=$(stat -f%z "$LOG")
          open -n "$APP"
          BOOTED=0
          for _ in $(seq 1 90); do
            if [ -f "$LOG" ] && tail -c +$((START + 1)) "$LOG" | grep 'boot complete' >/dev/null; then BOOTED=1; break; fi
            sleep 1
          done
          PID=$(pgrep -f "$APP/Contents/MacOS/launcher" | head -1 || true)
          if [ -z "$PID" ] || [ "$BOOTED" != 1 ]; then
            [ -z "$PID" ] && echo "ERROR: Intel application exited during startup"
            [ "$BOOTED" != 1 ] && echo "ERROR: Intel backend did not log 'boot complete' within 90s"
            if [ -f "$LOG" ]; then echo "--- vault-backend.log (this launch) ---"; tail -c +$((START + 1)) "$LOG" | tail -80; fi
            find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 1 \
              -type f \( -name 'launcher*.ips' -o -name 'keepkey-vault*.ips' -o -name 'bun*.ips' \) \
              -mmin -5 -print -exec sed -n '1,160p' {} \; 2>/dev/null || true
            exit 1
          fi
          tail -c +$((START + 1)) "$LOG" | grep 'PERF' || true
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          echo "Intel application remained alive through startup (pid $PID)"

  release:
    name: Create Draft Release
    needs: [build, intel-smoke]
    # Releases come only from v* tags or release/* branches (pushed or
    # dispatched). A dispatch on any other branch builds and tests without
    # creating a draft release.
    if: success() && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Derive release tag
        id: tag
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/* ]]; then
            echo "tag=${REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == refs/heads/release/* ]]; then
            VERSION="${REF#refs/heads/release/}"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # Only the app's build artifacts. Everything downloaded here is uploaded to
      # the release (artifacts/**/*), so a job-to-job hand-off artifact such as
      # electrobun-devkit-* must never match: a core artifact once shipped as a release
      # asset because this step downloaded every artifact in the run.
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: keepkey-vault-*
          merge-multiple: true

      - name: Generate combined checksums
        run: |
          cd artifacts
          # This unsigned DLL is a Windows release build input, not a public
          # release asset. The Windows production script Authenticode-signs it.
          rm -f emulator-build-input-*.dll
          # Remove per-platform checksum files (will regenerate combined)
          rm -f SHA256SUMS-*.txt SHA256SUMS.txt
          # Generate checksums for release-worthy files only
          shasum -a 256 *.dmg *.AppImage *.deb *.exe *.tar.zst *.tar.gz 2>/dev/null > SHA256SUMS.txt || true
          echo "=== Release checksums ==="
          cat SHA256SUMS.txt

      - name: List release artifacts
        run: find artifacts -type f | sort

      - name: Refuse to mutate an existing public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}" 2>/dev/null); then
            if [ "$(jq -r '.draft' <<<"$RELEASE_JSON")" != "true" ]; then
              echo "::error::${RELEASE_TAG} already exists as a public release; refusing to upload or replace assets"
              exit 1
            fi
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          name: KeepKey Desktop ${{ steps.tag.outputs.tag }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
